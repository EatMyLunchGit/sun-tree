<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plena · Plein de bon. Un plat par jour, avant midi.</title>
<meta name="description" content="Plena cuisine un plat chaque matin au Luxembourg et le dépose avant midi à votre bureau, votre salle de sport ou votre café. Sans abonnement.">
<meta name="theme-color" content="#F2B11B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F2B11B'/%3E%3Ccircle cx='32' cy='30' r='18' fill='%23E0432B'/%3E%3Cpath d='M0 46 L20 40 L44 47 L64 41 L64 64 L0 64Z' fill='%230F7C82'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Yellowtail&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#semaine" data-i18n="skip"></a>

<div class="banner"><p data-i18n="banner"></p></div>

<header class="top">
  <div class="wrap top-in">
    <a class="logo" href="#" aria-label="Plena">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="18" r="13" fill="#E0432B"/><path d="M0 29 L12 24 L27 30 L40 25 L40 40 L0 40Z" fill="#0F7C82"/></svg>
      <span>Plena</span>
    </a>
    <nav class="nav" aria-label="Navigation">
      <a href="#semaine" data-i18n="nav.menu"></a>
      <a href="#comment" data-i18n="nav.how"></a>
      <a href="#prix" data-i18n="nav.prices"></a>
      <a href="#bureau" data-i18n="nav.office"></a>
      <a href="#faq" data-i18n="nav.faq"></a>
    </nav>
    <div class="top-act">
      <div class="lang" role="group" aria-label="Langue / Language">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="cart-btn" id="cartBtn"><span data-i18n="basket"></span> <b id="cartCount">0</b></button>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap hero-in">
      <div class="hero-copy">
        <h1><span class="script" data-i18n="hero.h"></span></h1>
        <p class="lede" data-i18n="hero.sub"></p>
        <a class="btn btn-ink" href="#semaine" data-i18n="hero.cta"></a>
        <ul class="hero-pts">
          <li data-i18n="hero.p1"></li>
          <li data-i18n="hero.p2"></li>
          <li data-i18n="hero.p3"></li>
          <li data-i18n="hero.p4"></li>
        </ul>
      </div>
      <div class="hero-side">
        <figure class="hero-art" id="heroArt"></figure>
        <div class="reels" id="reels"></div>
      </div>
    </div>
    <svg class="tear" viewBox="0 0 1200 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40 L0 18 L90 10 L210 22 L340 8 L480 20 L610 6 L760 19 L880 9 L1010 21 L1120 11 L1200 17 L1200 40Z"/></svg>
  </section>

  <section class="trio">
    <div class="wrap trio-in">
      <div class="t1"><b data-i18n="trio.1"></b><span data-i18n="trio.1s"></span></div>
      <div class="t2"><b data-i18n="trio.2"></b><span data-i18n="trio.2s"></span></div>
      <div class="t3"><b data-i18n="trio.3"></b><span data-i18n="trio.3s"></span></div>
    </div>
  </section>

  <div class="ticker" aria-hidden="true"><div class="ticker-run" id="ticker"></div></div>

  <section class="sec" id="semaine">
    <div class="wrap">
      <div class="sec-head">
        <h2 data-i18n="week.h"></h2>
        <p data-i18n="week.sub"></p>
      </div>
      <p class="count" id="countdown" aria-live="polite"></p>
      <div class="tabs" role="tablist" id="weekTabs"></div>
      <div class="week" id="weekBoard"></div>
      <p class="fine" data-i18n="week.fine"></p>
    </div>
  </section>

  <section class="sec sec-teal" id="comment">
    <div class="wrap">
      <div class="sec-head"><h2 data-i18n="how.h"></h2></div>
      <ol class="how" id="howList"></ol>
      <a class="btn btn-cream" href="#semaine" data-i18n="how.cta"></a>
    </div>
  </section>

  <section class="sec" id="prix">
    <div class="wrap">
      <div class="sec-head">
        <h2 data-i18n="price.h"></h2>
        <p data-i18n="price.sub"></p>
      </div>
      <div class="ladder">
        <div class="step s1"><b class="amt" data-price="15.5"></b><span data-i18n="price.1"></span></div>
        <div class="step s2"><b class="amt" data-price="14.39"></b><span data-i18n="price.2"></span></div>
        <div class="step s3"><b class="amt" data-price="12.79"></b><span data-i18n="price.3"></span></div>
      </div>
      <p class="fine" data-i18n="price.fine"></p>
    </div>
  </section>

  <section class="sec sec-tomato" id="plat">
    <div class="wrap plat-in">
      <div class="plat-copy">
        <p class="kicker" data-i18n="dish.k"></p>
        <h2 data-i18n="dish.h"></h2>
        <p data-i18n="dish.p"></p>
        <ul class="stats" id="dishStats"></ul>
        <p class="fine light" data-i18n="dish.fine"></p>
      </div>
      <figure class="plat-art" id="dishArt"></figure>
    </div>
  </section>

  <section class="sec" id="dedans">
    <div class="wrap">
      <div class="sec-head"><h2 data-i18n="io.h"></h2></div>
      <div class="io">
        <div class="io-in"><h3 data-i18n="io.in"></h3><ul id="ioIn"></ul></div>
        <div class="io-out"><h3 data-i18n="io.out"></h3><ul id="ioOut"></ul></div>
      </div>
    </div>
  </section>

  <section class="sec sec-pink" id="standard">
    <div class="wrap std">
      <figure class="seal" id="seal"></figure>
      <div>
        <h2 data-i18n="std.h"></h2>
        <p data-i18n="std.sub"></p>
        <ul class="std-list" id="stdList"></ul>
      </div>
    </div>
  </section>

  <section class="sec sec-ink" id="cuisine">
    <div class="wrap kitchen">
      <div>
        <p class="kicker" data-i18n="kit.k"></p>
        <h2 data-i18n="kit.h"></h2>
        <p data-i18n="kit.p"></p>
        <a class="btn btn-mustard" href="#semaine" data-i18n="hero.cta"></a>
      </div>
      <ol class="log" id="kitLog"></ol>
    </div>
  </section>

  <section class="sec sec-mustard" id="avis">
    <div class="wrap">
      <div class="sec-head">
        <h2 data-i18n="rev.h"></h2>
        <p class="ph-note" data-i18n="rev.note"></p>
      </div>
      <div class="quotes" id="quotes"></div>
    </div>
  </section>

  <section class="sec" id="repertoire">
    <div class="wrap">
      <div class="sec-head">
        <h2 data-i18n="rep.h"></h2>
        <p data-i18n="rep.sub"></p>
      </div>
      <div class="chips" id="repFilters"></div>
      <div class="rep" id="repGrid"></div>
    </div>
  </section>

  <section class="sec sec-blue" id="bureau">
    <div class="wrap office">
      <div>
        <h2 data-i18n="off.h"></h2>
        <p data-i18n="off.p1"></p>
        <p data-i18n="off.p2"></p>
        <p data-i18n="off.p3"></p>
      </div>
      <form class="office-form" id="officeForm" novalidate>
        <label><span data-i18n="off.f1"></span><input name="company" autocomplete="organization" required></label>
        <label><span data-i18n="off.f2"></span><input name="email" type="email" autocomplete="email" required></label>
        <button class="btn btn-mustard" type="submit" data-i18n="off.cta"></button>
        <p class="form-msg" id="officeMsg" role="status"></p>
      </form>
    </div>
  </section>

  <section class="sec" id="faq">
    <div class="wrap narrow">
      <div class="sec-head"><h2>FAQ</h2></div>
      <div id="faqList"></div>
    </div>
  </section>
  <section class="cta-end">
    <div class="wrap">
      <h2 data-i18n="end.h"></h2>
      <a class="btn btn-ink" href="#semaine" data-i18n="end.cta"></a>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <div>
      <a class="logo logo-light" href="#"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="18" r="13" fill="#E0432B"/><path d="M0 29 L12 24 L27 30 L40 25 L40 40 L0 40Z" fill="#F2B11B"/></svg><span>Plena</span></a>
      <p class="script foot-tag" data-i18n="hero.h"></p>
    </div>
    <nav aria-label="Footer">
      <a href="#semaine" data-i18n="nav.menu"></a>
      <a href="#repertoire" data-i18n="foot.rep"></a>
      <a href="#bureau" data-i18n="nav.office"></a>
      <a href="#faq" data-i18n="nav.faq"></a>
    </nav>
    <div class="foot-legal">
      <p data-i18n="foot.contact"></p>
      <p data-i18n="foot.legal"></p>
      <p class="demo" data-i18n="foot.demo"></p>
    </div>
  </div>
</footer>

<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="bar-txt"><b id="barTotal"></b><span id="barNudge"></span></div>
    <button type="button" class="btn btn-mustard" id="barBtn" data-i18n="bar.cta"></button>
  </div>
</div>

<dialog class="sheet" id="dishDlg" aria-labelledby="dishDlgT"><div id="dishDlgBody"></div></dialog>
<dialog class="sheet" id="cartDlg" aria-labelledby="cartDlgT"><div id="cartDlgBody"></div></dialog>

<noscript><p style="padding:24px;font-family:sans-serif">Plena : un plat par jour, cuisiné au Luxembourg. Activez JavaScript pour voir le menu de la semaine.</p></noscript>
<script src="js/data.js"></script>
<script src="js/posters.js"></script>
<script src="js/app.js"></script>
</body>
</html>
